[workspace]
name = "robot-dev"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"

[tasks]
setup = "python tools/multiros/run.py setup"
doctor = "python tools/multiros/run.py doctor"
images = "python tools/multiros/run.py images"
build = "python tools/multiros/run.py build"
up = "python tools/multiros/run.py up"
down = "python tools/multiros/run.py down"
status = "python tools/multiros/run.py status"
exec = "python tools/multiros/run.py exec"
sim = "python tools/multiros/run.py sim"
sim-stop = "python tools/multiros/run.py sim-stop"
test = "python tools/multiros/run.py test"

[tool.multiros]
schema = 1
project = "robot-dev"
compose = ["compose.yaml"]
service = "ros-dev"
submodules = ["tools/multiros"]
rendering_base = true

[tool.multiros.container]
image = "robot-dev:local"
dockerfile = "docker/Dockerfile"
workdir = "/workspace/robot"
gpu = false
mounts = [{"source" = "{root}", "target" = "/workspace/robot"}]
ports = []

[tool.multiros.container.environment]

[tool.multiros.commands]
