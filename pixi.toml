[workspace]
name = "multiros"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]

[dependencies]
python = "3.12.*"

[tasks]
core = "python run.py"
test = "python -m unittest discover -s tests -v"
doctor = "python run.py doctor"
example-view = "python run.py view-example"

[feature.mujoco.pypi-dependencies]
mujoco = "==3.13.0"
numpy = ">=1.26,<3"

[environments]
default = []
mujoco = ["mujoco"]
